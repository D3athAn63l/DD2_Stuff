description=Choose your Beloved with simple Lock/Unlock. Locked NPCs have a configurable affinity cap (199 by default); unlocked NPCs can reach 299. Prevent unwanted affinity decreases for all NPCs while allowing manual changes in REFramework settings. Includes floating NPC and read-only Main Pawn affinity bars; pawn rating is independent of NPC cap/anti-loss. No extra mods required.
